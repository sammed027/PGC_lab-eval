apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-probe-app
  namespace: probe-lab
  labels:
    app: health-probe-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: health-probe-app
  template:
    metadata:
      labels:
        app: health-probe-app
    spec:
      containers:
        - name: health-app
          image: health-probe-demo:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 2
